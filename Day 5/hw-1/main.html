<!-- Homework #1
In this homework you should create your own e-commerce website.
For this homework you should use HTML5 tags.
Don't use css.

Description:
On Main page you should use not less than 3 different images for each category.
On Main page you should display at least 3 items of categories
`Category` items should be clickable and linked to corresponding page
On Main page you should have categories links.
On Category page you should use not less than 6 products with image, price, title and cropped description.
On Category page you should have link to the main page and each image should be a link to Single Item page.
The height for the image on Main page should be 200
The height for the image on Category page should be 200
The height for the image on Single Item page should be like as in original image.
On Signle Item page title, image, price and full description should be visible
On every page breadcrumb should be displayed, each part of breadcrumb should be clickable and working -->
